table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: editor
              - step_type:
                  _nin:
                    - db_write
                    - notify
      columns:
        - workflow_id
        - step_type
        - name
        - config
        - step_order
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - step_type
        - name
        - config
        - step_order
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - step_type
        - name
        - config
        - step_order
      filter:
