table:
  name: org_usage_stats
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: org_usage_stats
  custom_root_fields: {}
select_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - org_name
        - quota_limit
        - quota_used
        - quota_remaining
        - runs_this_month
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: org_id
