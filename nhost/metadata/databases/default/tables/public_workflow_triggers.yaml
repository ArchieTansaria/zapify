table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: editor
              - trigger_type:
                  _neq: webhook
      columns:
        - workflow_id
        - trigger_type
        - config
        - is_active
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - trigger_type
        - config
        - is_active
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - trigger_type
        - config
        - is_active
      filter:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: editor
              - trigger_type:
                  _neq: webhook
      check:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: editor
              - trigger_type:
                  _neq: webhook
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: editor
              - trigger_type:
                  _neq: webhook
event_triggers:
  - name: on_trigger_changed
    definition:
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: '{{NHOST_FUNCTIONS_URL}}/syncScheduledTrigger'
    headers:
      - name: x-nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
