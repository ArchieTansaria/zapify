type Mutation {
  approveStep(
    step_run_id: uuid!
  ): ApproveStepResult!
}

type Mutation {
  triggerWorkflowRun(
    workflow_id: uuid!
  ): TriggerWorkflowRunResult!
}

type TriggerWorkflowRunResult {
  success: Boolean!
  run_id: uuid
  status: String
}

type ApproveStepResult {
  success: Boolean!
  run_id: uuid
  status: String
}

